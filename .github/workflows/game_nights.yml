name: Game Night Table Creation

on:
  schedule:
    # 5:00 PM PST is 12:00 AM UTC (next day / 00:00 UTC)
    # Mon, Wed, Fri, Sat night at 5:00 PM PST (Tue, Thu, Sat, Sun at 00:00 UTC)
    - cron: '0 0 * * 2,4,6,0'
  workflow_dispatch:
    inputs:
      table_config:
        description: 'Table variant and count configuration (e.g., nlh 2 plo 1)'
        required: true
        default: 'nlh 2'

jobs:
  create-tables:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Set default configuration
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ARGS=${{ github.event.inputs.table_config }}" >> $GITHUB_ENV
          else
            # Default table setup for scheduled game nights (e.g. 2 NLH tables)
            echo "ARGS=nlh 2" >> $GITHUB_ENV
          fi

      - name: Create games and announce
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python announce_games.py $ARGS

      - name: Commit game history back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_created_games.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update game creation history for $(date +%F)" && git push)
